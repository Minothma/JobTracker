name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # 1. Backend CI (Lint, Test, Build)
  # ==========================================
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Run Unit Tests
        working-directory: backend
        run: npm run test

      - name: Run NestJS Build
        working-directory: backend
        run: npm run build

  # ==========================================
  # 2. Frontend CI (Type Check, Next.js Build)
  # ==========================================
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Next.js Production Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
        run: npm run build

  # ==========================================
  # 3. Docker Image Build Verification
  # ==========================================
  docker-build-check:
    name: Docker Builds Check
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: jobtracker-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: jobtracker-frontend:test

  # ==========================================
  # 4. AWS CDK Infra Synth Check
  # ==========================================
  infra-check:
    name: AWS CDK Synth Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK Dependencies
        working-directory: infra
        run: npm ci || npm install

      - name: Synthesize CloudFormation Templates
        working-directory: infra
        run: npx cdk synth
