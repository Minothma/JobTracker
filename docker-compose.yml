services:
  # ==========================================
  # 1. PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:15
    container_name: jobtracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobtracker
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/V1__init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobtracker"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ==========================================
  # 2. NestJS Backend API
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: jobtracker-backend:latest
    container_name: jobtracker-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/jobtracker?schema=public
      JWT_ACCESS_SECRET: dev-jwt-access-secret-key-super-secure-docker-compose
      JWT_REFRESH_SECRET: dev-jwt-refresh-secret-key-super-secure-docker-compose
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      PORT: 4000
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: jobtracker-resumes-dev
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # 3. Next.js Frontend
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    image: jobtracker-frontend:latest
    container_name: jobtracker-frontend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
